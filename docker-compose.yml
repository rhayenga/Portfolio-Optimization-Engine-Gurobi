services:
  api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Academic named-user licenses do not work in Docker.
    # Set WLS env vars if you have a floating/web license:
    # environment:
    #   - GRB_WLSACCESSID=
    #   - GRB_WLSSECRET=
    #   - GRB_WLSLICENSEID=
